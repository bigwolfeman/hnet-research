[project]
name = "hnet-smoke"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.14",  # 2.11 Inductor crashes compiling the dynamic-shape stage glue (tiling_utils.analyze_memory_coalescing)
  "numpy",
  "hydra-core>=1.3",
  "omegaconf",
  "wandb",
  "pyarrow",
  "tiktoken",
  "pytest",
]

[tool.setuptools]
packages = ["hnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
