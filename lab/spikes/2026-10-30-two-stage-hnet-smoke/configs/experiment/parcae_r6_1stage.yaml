# @package _global_
# Parcae looped main on the 1-stage H-Net (loop1_1stage: stage 0 T2/T2 window 512, ratio 4, d 256 | 512):
#   main = prelude T1 -> core T1 looped, mean recurrence 6 (Poisson per row, last 3 step(s) with grad) -> coda T1
#   1 + 6 x 1 + 1 = 8 block passes per main position at eval, as loop1_1stage's T8 (hnet/parcae.py)
# Experiment: lab/experiments/refuted/2026-11-04-parcae-coarse-main.md
experiment:
  name: parcae_r6_1stage
train:
  lr_mult: [1.5, 1.0]
  ratio_integral_lr: 0.002
model:
  d_model: [256, 512]
  main:
    kind: parcae
    layers: null
    loops: 1
    parcae:
      prelude: 1
      core: 1
      coda: 1
      mean_recurrence: 6
      backprop_depth: 3
      decay_init: 0.4472135954999579   # sqrt(1/5), the Parcae init table's ssm_decay
      seed: ${seed}
  stages:
    - enc_layers: 2
      dec_layers: 2
      window: 512
      router: {name: lookahead, target_ratio: 4.0, loss_weight: 0.03, kwargs: {}}
