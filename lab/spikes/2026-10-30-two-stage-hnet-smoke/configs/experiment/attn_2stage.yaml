# @package _global_
# reflayout_2stage with no SSM: every Mamba-2 block of the outer stages becomes a sliding-window attention block
# (no MLP, like the m blocks it replaces). Same widths, routers, ratios, LR, main (T10 global at d 512).
#   layout  t4 | T1t4 | T10 | t4T1 | t4
#   windows stage 0: 704 keys, so a t block's fwd FLOPs/position match the m block's (0.994x at L 4096);
#           stage 1: 1024 keys (0.975x of m at L 4096 / 3.15). Model fwd FLOPs/byte stay within 1% of reflayout_2stage.
# Experiment: lab/experiments/planned/2026-11-05-attention-only-outer-stages.md
defaults:
  - reflayout_2stage
  - _self_
experiment:
  name: attn_2stage
model:
  stages:
    - enc_layers: 4
      dec_layers: 4
      enc_layout: t4
      dec_layout: t4
      window: 704
      router: {name: lookahead, target_ratio: 3.0, loss_weight: 0.03, kwargs: {}}
    - enc_layers: 5
      dec_layers: 5
      enc_layout: T1t4
      dec_layout: t4T1
      window: 1024
      router: {name: lookahead, target_ratio: 3.0, loss_weight: 0.03, kwargs: {}}
