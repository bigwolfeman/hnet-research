# @package _global_
experiment:
  name: eoc_2stage
model:
  stages:
    - enc_layers: 2
      dec_layers: 2
      window: 512
      router: {name: eoc, target_ratio: 4.0, loss_weight: 0.03, kwargs: {read_own_end: true, force_last: false}}
    - enc_layers: 2
      dec_layers: 2
      window: 256
      router: {name: eoc, target_ratio: 2.0, loss_weight: 0.03, kwargs: {read_own_end: true, force_last: false}}
