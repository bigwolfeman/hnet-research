defaults:
  - model: base
  - train: smoke
  - data: bytes
  - experiment: reflayout_2stage   # the 2-stage default: lab/experiments/successes/2026-11-04-reference-layout-seeds-vs-bpe.md
  - _self_

seed: 0
device: cuda
wandb:
  mode: online
  project: hnet-smoke
  group: two-stage-smoke
  name: ${experiment.name}
hydra:
